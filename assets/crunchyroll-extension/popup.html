<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Crunchyroll shortcut</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: #101622;
        color: #eef3fb;
        font: 15px system-ui;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        line-height: 1.6;
        color: #bec9da;
      }
      label {
        display: block;
        margin-block: 18px 8px;
      }
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        font: inherit;
        color: inherit;
        background: #202c40;
        border: 1px solid #71819b;
        border-radius: 8px;
      }
      a {
        display: block;
        margin-block: 20px;
        padding: 14px;
        border-radius: 8px;
        background: #ffab70;
        color: #171e29;
        text-decoration: none;
        font-weight: 650;
        text-align: center;
      }
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid #91cfff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <img src="icons/icon192.png" alt="" />
    <h1 data-message="title">The God Who Destroys</h1>
    <label for="language" data-message="language">App language</label
    ><select id="language"></select>
    <a
      id="watch"
      href="https://www.crunchyroll.com/fr/watch/GE00389313JAJP/the-god-who-destroys"
      target="_blank"
      rel="noopener noreferrer"
      data-message="open"
      >Watch on Crunchyroll</a
    >
    <p data-message="note">
      This changes the shortcut language. Crunchyroll controls audio, subtitles, account access and playback.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
